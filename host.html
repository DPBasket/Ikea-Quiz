<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IKEA QUIZ · Schermo</title>
<link rel="stylesheet" href="quiz-host.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --blue:#0058A3; --blue-2:#004F93; --yellow:#FFDB00; --ink:#111; --floor:#F2F2F2; --track:#E0E0E0; --grey:#5C5C5C; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--blue); color:var(--ink); overflow:hidden;
    font-family:"Noto Sans", system-ui, sans-serif; }
  button { font:inherit; cursor:pointer; border:0; border-radius:0; }
  .screen { position:absolute; inset:0; display:none; }
  .screen.on { display:flex; }
  .btn { background:var(--ink); color:#fff; font-weight:800; padding:.8em 1.3em; font-size:16px; transition:transform .15s cubic-bezier(.22,1,.36,1); }
  .btn:hover { transform:translateY(-2px); }
  .btn:focus-visible { outline:4px solid var(--yellow); outline-offset:3px; }
  .btn.y { background:var(--yellow); color:var(--blue); }
  .btn.ghost { background:var(--blue-2); color:#fff; }
  .btn:disabled { background:#7A9CC2; color:#DCE6F0; cursor:not-allowed; transform:none; }

  /* lobby: the blue field, the code big, the players as they arrive */
  #lobby { --u:min(1vw, 1.777vh); padding:calc(var(--u) * 3); gap:calc(var(--u) * 3.5); color:#fff; background:var(--blue); }
  #lobby .col { display:flex; flex-direction:column; gap:calc(var(--u) * 1.6); min-width:0; }
  #lobby .join { width:calc(var(--u) * 30); }
  #lobby h1 { font-weight:800; font-size:calc(var(--u) * 6); line-height:1; letter-spacing:-.025em; }
  #lobby h1 span { font-weight:400; }
  .codebox { font-weight:700; font-size:calc(var(--u) * 1.5); }
  .codebox .code { font-size:calc(var(--u) * 9); font-weight:800; letter-spacing:.04em; color:var(--yellow); line-height:1; font-variant-numeric:tabular-nums; }
  #qr { width:100%; aspect-ratio:1; background:#fff; padding:calc(var(--u) * 1); image-rendering:pixelated; display:block; }
  #url { font-size:calc(var(--u) * 1); opacity:.8; word-break:break-all; }
  #lobby .players { flex:1; }
  #lobby h2 { font-size:calc(var(--u) * 2.2); font-weight:800; letter-spacing:-.01em; }
  #lobby h2 small { font-weight:400; font-size:.6em; opacity:.8; }
  #plist { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:calc(var(--u) * .6); align-content:start; overflow:auto; min-height:0; flex:1 1 0; }
  #plist .pchip { font-size:calc(var(--u) * 1.3); padding:calc(var(--u) * .35) calc(var(--u) * .5); min-width:0; gap:calc(var(--u) * .5); position:relative; }
  #plist .pchip .rm { position:absolute; right:0; top:0; bottom:0; margin:0; display:none; background:#C4161C; opacity:1; padding:0 .6em; }
  #plist .pchip:hover .rm, #plist .pchip .rm:focus-visible { display:block; }
  #plist .pchip span { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.1; }
  #plist .pchip span small { display:block; margin:0; font-size:.62em; font-weight:400; opacity:.8; }
  #plist .pchip img { width:calc(var(--u) * 3.4); height:calc(var(--u) * 3.4); flex:none; }
  #lobby .col { min-height:0; }
  .pchip { display:flex; align-items:center; gap:calc(var(--u) * .8); background:var(--blue-2); padding:calc(var(--u) * .5) calc(var(--u) * .9); font-weight:800; font-size:calc(var(--u) * 1.6); animation:pin .5s cubic-bezier(.22,1,.36,1) both; }
  .pchip img { width:calc(var(--u) * 4.4); height:calc(var(--u) * 4.4); }
  .pchip small { font-size:.6em; font-weight:400; opacity:.8; margin-left:auto; }
  @keyframes pin { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .empty { font-weight:700; font-size:calc(var(--u) * 1.8); opacity:.85; max-width:24ch; line-height:1.35; }
  #lobby .tracks { width:calc(var(--u) * 33); }
  #tlist { display:flex; flex-direction:column; gap:8px; }
  .eplan { display:flex; flex-direction:column; gap:calc(var(--u) * .3); overflow:auto; }
  .eplan div { background:var(--blue-2); padding:.55em .9em; font-weight:700; font-size:calc(var(--u) * 1.3); }
  .eplan .race { background:var(--yellow); color:var(--blue); }
  .tcard { display:flex; gap:12px; align-items:center; background:#fff; padding:8px; text-align:left; }
  .tcard canvas { width:120px; height:75px; flex:none; }
  .tcard b { display:block; font-size:16px; font-weight:800; }
  .tcard span { font-size:12px; color:var(--grey); }
  .actions { display:flex; gap:calc(var(--u) * .5); flex-wrap:wrap; }
  .tools .btn { font-size:calc(var(--u) * 1.1); padding:.6em .9em; }
  #start, #resume { font-size:calc(var(--u) * 2); flex:1; padding:.8em; }
  #tlist { overflow:auto; min-height:0; flex:1; }
  .tcard.sel { background:var(--yellow); }
  .tcard.sel span { color:var(--ink); }
  .pchip .rm { margin-left:calc(var(--u) * .6); background:none; color:#fff; font-weight:800; font-size:.9em; padding:0 .35em; opacity:.7; }
  .pchip .rm:hover { opacity:1; background:#C4161C; }
  .pchip.off { opacity:.6; }
  .modebar { display:flex; gap:0; }
  .modebar button { flex:1; font-weight:800; font-size:calc(var(--u) * 1.25); padding:.6em; background:var(--blue-2); color:#fff; }
  .modebar button.sel { background:#fff; color:var(--blue); }
  /* host menu: on every screen except the lobby */
  #hmenu { position:fixed; top:0; right:0; z-index:60; display:none; flex-direction:column; align-items:flex-end; font-family:"Noto Sans", system-ui, sans-serif; }
  body.inplay #hmenu { display:flex; }
  #hmenu > button { background:rgba(17,17,17,.55); color:#fff; font-weight:800; font-size:12px; padding:.45em .9em; }
  #hmenu > button:hover { background:#111; }
  #hpanel { display:none; flex-direction:column; background:#111; padding:6px; gap:6px; min-width:220px; }
  #hmenu.open #hpanel { display:flex; }
  #hpanel button { background:#2A2A2A; color:#fff; font-weight:700; font-size:14px; padding:.7em 1em; text-align:left; }
  #hpanel button:hover { background:#3A3A3A; }
  #hpanel button.danger { background:#C4161C; }
  #quiz .qtop { padding-right:90px !important; }
  #msg { color:var(--yellow); font-weight:700; min-height:1.2em; font-size:calc(var(--u) * 1.2); }
  @media (prefers-reduced-motion: reduce) { .pchip { animation:none; } .btn { transition:none; } }

  /* race */
  #race { background:var(--floor); }
  #cv { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #cv3 { position:absolute; left:0; top:0; height:100%; width:calc(100% - min(320px, 24vw)); display:block; }
  #abort { position:absolute; left:12px; bottom:12px; font-size:12px; padding:.5em .9em; opacity:.6; background:var(--ink); }
  #abort:hover { opacity:1; }

  /* race results */
  #results { flex-direction:row; background:var(--floor); }
  #podium { flex:1.3; min-width:0; height:100%; display:block; }
  #rside { flex:1; display:flex; flex-direction:column; padding:4vh 3vw; gap:1.6vh; background:#fff; }
  #rside h1 { font-weight:800; font-size:clamp(28px, 3.2vw, 52px); line-height:1; letter-spacing:-.02em; }
  #rside h1 span { font-weight:400; }
  #rfast { font-weight:700; font-size:clamp(14px, 1.2vw, 20px); background:var(--yellow); padding:.6em .8em; }
  #rfast:empty { display:none; }
  #rtable { display:flex; flex-direction:column; gap:4px; overflow:auto; }
  .rrow { display:grid; grid-template-columns:54px 1fr auto; gap:10px; align-items:center; padding:10px 12px; background:var(--floor); }
  .rrow .rk { font-size:28px; font-weight:800; color:var(--blue); }
  .rrow .nm { font-size:20px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .rrow .nm i { width:14px; height:14px; display:inline-block; }
  .rrow .tm { font-size:22px; font-weight:800; text-align:right; font-variant-numeric:tabular-nums; }
  .rrow .laps { grid-column:2 / 4; font-size:13px; color:var(--grey); font-weight:700; font-variant-numeric:tabular-nums; }
  .rrow.first { background:var(--yellow); }
  #continue { font-size:22px; margin-top:auto; }
</style>
</head>
<body>

<section id="lobby" class="screen on">
  <div class="col join">
    <h1>IKEA <span>quiz</span></h1>
    <div class="codebox">Inquadra il codice o scrivi questo numero<div class="code" id="code">····</div></div>
    <img id="qr" alt="Codice QR per entrare col telefono">
    <div id="url"></div>
  </div>
  <div class="col players">
    <h2><span id="pcount">0</span> in negozio <small>(al massimo 15)</small></h2>
    <div id="plist"></div>
    <div class="actions tools" style="margin-top:auto">
      <button class="btn ghost" id="addBots">Aggiungi 3 bot</button>
      <button class="btn ghost" id="addBots7">Aggiungi 7 bot</button>
      <button class="btn ghost" id="clearBots">Togli i bot</button>
      <button class="btn ghost" id="clearOff" style="display:none">Togli chi è offline</button>
    </div>
  </div>
  <div class="col tracks">
    <div class="modebar" id="modebar"><button id="mQuiz" class="sel">Quiz e gare</button><button id="mRace">Solo gare</button></div>
    <div id="eplan" class="eplan"></div>
    <div id="tlist" style="display:none"></div>
    <div id="msg"></div>
    <div id="imgwarn" class="imgwarn" style="display:none"></div>
    <div class="actions"><button class="btn y" id="start">Inizia la serata</button><button class="btn y" id="raceGo" style="display:none">Parti</button></div>
    <div class="actions"><button class="btn y" id="resume" style="display:none">Riprendi la partita</button>
      <button class="btn" id="lreset" style="display:none">Azzera il quiz</button></div>
  </div>
</section>

<section id="quiz" class="screen"></section>

<div id="hmenu"><button id="hmbtn" aria-expanded="false">Menu</button>
  <div id="hpanel">
    <button id="hLobby">Vai alla lobby (la partita resta)</button>
    <button id="hReset" class="danger">Interrompi e azzera il quiz</button>
  </div>
</div>

<section id="race" class="screen">
  <canvas id="cv3"></canvas>
  <canvas id="cv"></canvas>
  <button class="btn" id="abort">Annulla la gara</button>
</section>

<section id="results" class="screen">
  <canvas id="podium"></canvas>
  <div id="rside">
    <h1>Tack! <span id="rtrack"></span></h1>
    <p id="rfast"></p>
    <div id="rtable"></div>
    <button class="btn y" id="continue">Continua</button>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/three.min.js"></script>
<script src="tracks.js"></script>
<script src="render.js"></script>
<script src="quiz-host.js"></script>
<script>
'use strict';
const TR = window.IKEA_TRACKS, R = window.IKEA_RENDER;
const $ = id => document.getElementById(id);
const socket = io();

let lobby = null, room = null, selTrack = TR.list[0].id;
let race = null, state = null;           // race = { track, cars: {id:{name,color}} }
const disp = {}, parts = new R.Particles();
let countdownEnd = 0, goFlash = 0, flashUntil = 0, darkUntil = 0, banner = null;
const ticker = [];
let screen = 'lobby';

function show(id) {
  screen = id;
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id);
  document.body.classList.toggle('inplay', id !== 'lobby');
  $('hmenu').classList.remove('open');
}
function pushTicker(text, color) { ticker.unshift({ text, color: color || R.C.ink, at: performance.now() }); ticker.length = Math.min(ticker.length, 5); }
function setBanner(text, ms, color) { banner = { text, until: performance.now() + (ms || 1800), color: color || R.C.blue }; }
const carName = id => (race && race.cars[id] ? race.cars[id].name : '?');

/* ---------- lobby ---------- */
function carChip(color) {
  const c = document.createElement('canvas'); c.width = 112; c.height = 64;
  const x = c.getContext('2d'); x.scale(4, 4); R.drawCar(x, 14, 8, 0, color);
  return c;
}
function renderTracks() {
  const box = $('tlist'); box.innerHTML = '';
  TR.list.forEach(t => {
    const b = document.createElement('button'); b.className = 'tcard' + (t.id === selTrack ? ' sel' : '');
    const c = document.createElement('canvas'); c.width = 240; c.height = 150;
    c.getContext('2d').drawImage(R.trackCanvas(t, 0.3), 0, 0, 240, 150);
    const d = document.createElement('div'); d.innerHTML = `<b>${t.name}</b><span>${t.desc} · ${t.open ? 'da A a B' : (t.laps || 2) + ' giri'}</span>`;
    b.append(c, d);
    b.onclick = () => { selTrack = t.id; socket.emit('select_track', { trackId: t.id }); renderTracks(); };
    box.append(b);
  });
}
function renderLobby() {
  if (!lobby) return;
  selTrack = lobby.trackId || selTrack;
  const list = $('plist'); list.innerHTML = '';
  lobby.players.forEach(p => {
    const d = document.createElement('div'); d.className = 'pchip';
    const im = document.createElement('img'); im.src = R.avatarURL(p.color, p.avatar || 'lampada', 92); d.append(im);
    const n = document.createElement('span'); n.textContent = p.name; d.append(n);
    const tag = p.bot ? 'bot' : !p.connected ? 'offline' : '';
    if (tag) { const s = document.createElement('small'); s.textContent = tag; n.append(s); }
    if (!p.bot && !p.connected) d.classList.add('off');
    if (lobby.phase === 'lobby') {
      const x = document.createElement('button'); x.className = 'rm'; x.textContent = '×'; x.title = 'Togli ' + p.name; x.setAttribute('aria-label', 'Togli ' + p.name);
      x.onclick = () => { if (p.bot || !p.connected || confirm(`Togliere ${p.name} dal negozio? Perde i suoi punti.`)) socket.emit('remove_player', { id: p.id }); };
      d.append(x);
    }
    list.append(d);
  });
  $('clearOff').style.display = lobby.players.some(p => !p.bot && !p.connected) ? '' : 'none';
  if (!lobby.players.length) list.innerHTML = '<p class="empty">Ancora nessuno. Inquadrate il codice QR col telefono per entrare.</p>';
  $('pcount').textContent = lobby.players.length;
  const n = lobby.players.length;
  $('start').disabled = n < 1;
  $('msg').textContent = n === 1 ? 'Con un solo giocatore le gare vengono saltate (aggiungi i bot per provare).' : '';
  renderTracks(); renderPlan();
  renderMode();
}
// two ways to play: the whole evening (quiz + races) or only kart races on a track of your choice
let mode = 'quiz';
function renderMode() {
  if (!lobby) return;
  const started = lobby.quizStarted, races = mode === 'race' && !started;
  $('modebar').style.display = started ? 'none' : '';
  $('mQuiz').classList.toggle('sel', !races); $('mRace').classList.toggle('sel', races);
  $('eplan').style.display = races ? 'none' : '';
  $('tlist').style.display = races ? '' : 'none';
  $('start').style.display = started || races ? 'none' : '';
  $('raceGo').style.display = races ? '' : 'none';
  $('raceGo').textContent = `Parti: ${TR.byId[selTrack] ? TR.byId[selTrack].name : ''}`;
  $('raceGo').disabled = lobby.players.length < 2;
  const busy = lobby.phase !== 'lobby';
  $('resume').style.display = started || busy ? '' : 'none';
  $('resume').textContent = busy ? 'Torna alla gara' : 'Riprendi la partita';
  $('lreset').style.display = started || busy ? '' : 'none';
  if (busy) { $('start').style.display = 'none'; $('raceGo').style.display = 'none'; }
  if (races && lobby.players.length < 2) $('msg').textContent = 'Per una gara servono almeno 2 giocatori (o aggiungi i bot).';
}
$('mQuiz').onclick = () => { mode = 'quiz'; renderLobby(); };
$('mRace').onclick = () => { mode = 'race'; renderLobby(); };
$('raceGo').onclick = () => socket.emit('start_race', { trackId: selTrack });
$('clearOff').onclick = () => socket.emit('remove_offline');
$('hmbtn').onclick = () => { const m = $('hmenu'); m.classList.toggle('open'); $('hmbtn').setAttribute('aria-expanded', m.classList.contains('open')); };
$('hLobby').onclick = () => show('lobby');
$('lreset').onclick = () => { if (confirm('Azzerare il quiz? I punti tornano a zero.')) socket.emit('quiz_reset'); };
$('hReset').onclick = () => {
  if (!confirm('Interrompere e azzerare tutto? Gara e quiz si fermano e i punti tornano a zero.')) return;
  socket.emit('quiz_reset'); show('lobby');
};
$('addBots').onclick = () => socket.emit('demo_add', { n: 3 });
$('addBots7').onclick = () => socket.emit('demo_add', { n: 7 });
$('clearBots').onclick = () => socket.emit('demo_clear');
$('start').onclick = () => socket.emit('quiz_next');            // starts the evening
$('resume').onclick = () => {
  if (lobby && (lobby.phase === 'race' || lobby.phase === 'countdown')) return show('race');
  if (lobby && lobby.phase === 'results') return show('results');
  if (quizView) { show('quiz'); IKEA_QUIZ_HOST.onQuiz(quizView); }
};
function renderPlan() {
  const races = [['showroom', 1], ['magazzino', 2], ['ristorante', 3], ['smaland', 4]], parts = ['Storia IKEA', 'Indovina l\'oggetto', 'Persona o mobile?', 'Città svedese o mobile?'];
  $('eplan').innerHTML = races.map(([t], i) => `<div class="race">Gara ${i + 1} · ${TR.byId[t].name}</div><div>Parte ${i + 1} · ${parts[i]}</div>`).join('')
    + `<div class="race">Gara finale, punti doppi · ${TR.byId.casse.name}</div><div>Lo scontrino finale</div>`;
}
let quizView = null;
// check that every quiz picture is on the server (a folder can get lost when uploading to GitHub)
fetch('/quiz-images.json').then(r => r.json()).then(list => Promise.all(list.map(f => new Promise(ok => {
  const im = new Image(); im.onload = () => ok(null); im.onerror = () => ok(f); im.src = f;
})))).then(res => {
  const miss = res.filter(Boolean);
  if (!miss.length) return;
  $('imgwarn').style.display = '';
  $('imgwarn').innerHTML = `⚠ ${miss.length} foto del quiz non trovate sul server (${miss.slice(0, 4).join(', ')}${miss.length > 4 ? '…' : ''}).<br>Caricale su GitHub nella cartella <b>public</b> (i file che iniziano con <b>q-</b>).`;
}).catch(() => {});
socket.on('quiz', v => {
  quizView = v;
  if (!v.started) { if (screen === 'quiz') show('lobby'); return; }
  if (v.stage === 'raceResults' && v.lastRace && v.lastRace.fastest) {
    const f = v.lastRace.fastest;
    $('rfast').textContent = `Giro più veloce: ${f.name}, ${R.fmtTime(f.time)}. +10 punti${v.lastRace.final ? '' : ' e un potere alla prima domanda della prossima parte'}.`;
  } else if (v.stage === 'raceResults' && v.lastRace && v.lastRace.tiebreak) {
    const w = v.lastRace.results[0];
    $('rfast').textContent = `Spareggio vinto da ${w ? w.name : ''}. Premi Continua per la classifica finale.`;
  } else if (v.stage === 'raceResults') $('rfast').textContent = '';
  if (IKEA_QUIZ_HOST.handlesStage(v.stage)) {
    if (screen !== 'quiz') show('quiz');
    IKEA_QUIZ_HOST.onQuiz(v);
  }
});
$('abort').onclick = () => { if (confirm('Annullare la gara e tornare alla lobby?')) socket.emit('abort_race'); };
$('continue').onclick = () => socket.emit('continue');

/* ---------- socket ---------- */
socket.on('connect', () => socket.emit('host_hello'));
socket.on('room', r => { room = r; $('code').textContent = r.code; if (r.qr) $('qr').src = r.qr; $('url').textContent = r.url; });
socket.on('lobby', l => { lobby = l; renderLobby(); if (l.phase === 'lobby' && !l.quizStarted && screen !== 'lobby') show('lobby'); });
socket.on('host_error', m => { $('msg').textContent = m; });
const view = window.IKEA_3D.createView($('cv3'), { mode: 'overview', maxDpr: 1.5 });
socket.on('race_countdown', d => {
  race = { track: TR.byId[d.trackId], laps: d.laps, cars: {} };
  d.players.forEach(p => { race.cars[p.id] = p; });
  view.setTrack(race.track); view.setCars(race.cars);
  for (const k in disp) delete disp[k];
  state = null; ticker.length = 0; parts.a = [];
  countdownEnd = performance.now() + d.ms;
  show('race');
});
socket.on('race_go', () => { goFlash = performance.now() + 900; });
socket.on('state', s => { state = s; });
socket.on('powerup_collected', d => {});
socket.on('powerup_used', d => {
  const label = TR.ITEMS[d.item] ? TR.ITEMS[d.item].label : d.item;
  pushTicker(`${carName(d.playerId)} · ${label}`, race && race.cars[d.playerId] ? race.cars[d.playerId].color : null);
  if (d.item === 'KOTTBULLAR_GOLD') view.sparks.emit(d.x, 12, d.y, { n: 40, colors: ['#F2B705', '#FFDB00', '#FFFFFF'], speed: 160, up: 120, life: 1 });
  if (d.item === 'HOTDOG') setBanner(`${carName(d.playerId)} HA UN HOT DOG!`, 1500, R.C.red);
  if (d.item === 'PILLOW_BLUE') setBanner(`CUSCINO BLU DI ${carName(d.playerId)} → AL PRIMO!`, 1800, '#1E5BD8');
});
socket.on('lap_completed', d => {
  if (race && d.lap < race.laps) pushTicker(`${carName(d.playerId)} · GIRO ${d.lap}  ${R.fmtTime(d.time)}`);
});
socket.on('fx', f => {
  view.fx(f);
  switch (f.k) {
    case 'flag': flashUntil = performance.now() + 2000; setBanner(`${carName(f.id)}: BANDIERA SVEDESE! TUTTI RALLENTANO`, 2000, '#006AA7'); break;
    case 'catch': pushTicker(`${carName(f.id)} ha preso il gelato!`); break;
    case 'trick': pushTicker(`${carName(f.id)} · TRICK!`, '#FF7A00'); break;
    case 'event': setBanner('⚠ ' + (TR.EVENTS[f.ev] || f.ev), 1800, R.C.ink); break;
    case 'finish':
      pushTicker(`${carName(f.id)} · ARRIVATO ${f.rank}° · ${R.fmtTime(f.time)}`, race && race.cars[f.id] ? race.cars[f.id].color : null);
      setBanner(`${carName(f.id)} ${f.rank}°!`, 1600, R.C.blue);
      break;
  }
});
socket.on('blackout', d => { darkUntil = performance.now() + d.ms; });
socket.on('sabotage_throw', d => pushTicker(`${carName(d.playerId)} lancia dall'alto!`, R.C.red));
socket.on('race_finished', d => showResults(d));
socket.on('quiz_continue', () => { /* TODO(quiz): the host would hand control back to the quiz app here */ });

/* ---------- race render ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (screen === 'results') { drawPodium(now); return; }
  if (screen !== 'race' || !race) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = cv.clientWidth, ch = cv.clientHeight;
  if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(ch * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); }
  const panel = Math.min(320, cw * 0.24);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  if (state) {
    R.lerpCars(disp, state.p, dt);
    view.update(state, disp, dt, now, { host: true, names: true });
  }
  view.render();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawHud(now, cw, ch, panel);
}
requestAnimationFrame(frame);

function drawHud(now, cw, ch, panel) {
  const C = R.C;
  // standings panel
  const px = cw - panel;
  ctx.fillStyle = '#fff'; ctx.fillRect(px, 0, panel, ch);
  ctx.fillStyle = C.ink; ctx.fillRect(px, 0, 3, ch);
  ctx.fillStyle = C.blue; ctx.fillRect(px + 3, 0, panel - 3, 70);
  ctx.fillStyle = C.yellow; ctx.font = '900 20px Verdana, Arial, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(race.track.name, px + 18, 24, panel - 30);
  ctx.fillStyle = '#fff'; ctx.font = '800 15px Verdana, Arial, sans-serif';
  const t = state ? state.t : -(countdownEnd - now);
  ctx.fillText(t > 0 ? R.fmtTime(t) : 'PRONTI…', px + 18, 50);
  if (state) {
    const byId = {}; state.p.forEach(p => { byId[p.i] = p; });
    const rowH = Math.max(26, Math.min(58, (ch - 240) / Math.max(1, state.o.length)));
    state.o.forEach((id, i) => {
      const p = byId[id], car = race.cars[id];
      if (!p || !car) return;
      const y = 84 + i * rowH;
      ctx.fillStyle = i % 2 ? '#fff' : C.floor; ctx.fillRect(px + 3, y, panel - 3, rowH);
      ctx.fillStyle = C.blue; ctx.font = `900 ${Math.min(26, rowH * 0.5)}px Verdana, sans-serif`; ctx.textAlign = 'left';
      ctx.fillText(i + 1, px + 12, y + rowH / 2);
      ctx.fillStyle = car.color; ctx.fillRect(px + 46, y + rowH / 2 - 7, 14, 14);
      ctx.fillStyle = C.ink; ctx.font = `800 ${Math.min(17, rowH * 0.34)}px Verdana, sans-serif`;
      ctx.fillText(car.name, px + 68, y + rowH / 2 - (p.fin ? 0 : 7), panel - 130);
      ctx.font = `700 ${Math.min(12, rowH * 0.24)}px Verdana, sans-serif`; ctx.fillStyle = '#767676';
      if (p.fin) { ctx.textAlign = 'right'; ctx.fillStyle = C.ink; ctx.font = '900 14px Verdana, sans-serif'; ctx.fillText(R.fmtTime(p.ft), cw - 12, y + rowH / 2); }
      else {
        ctx.fillText(race.track.open ? 'DA A A B' : `GIRO ${Math.min(race.laps, p.l + 1)}/${race.laps}`, px + 68, y + rowH / 2 + 10);
        if (p.it) R.drawItem(ctx, p.it, cw - 26, y + rowH / 2, 1.2);
      }
    });
  }
  // ticker
  ctx.textAlign = 'left';
  ticker.forEach((m, i) => {
    const age = (now - m.at) / 1000; if (age > 6) return;
    ctx.globalAlpha = Math.max(0, Math.min(1, 6 - age));
    const y = ch - 30 - i * 26;
    ctx.font = '800 13px Verdana, sans-serif'; const w = ctx.measureText(m.text).width + 22;
    ctx.fillStyle = '#fff'; ctx.fillRect(px + 12, y - 11, Math.min(w, panel - 24), 22);
    ctx.fillStyle = m.color; ctx.fillRect(px + 12, y - 11, 5, 22);
    ctx.fillStyle = C.ink; ctx.fillText(m.text, px + 22, y + 1, panel - 40);
    ctx.globalAlpha = 1;
  });
  const area = cw - panel;
  // countdown
  const left = countdownEnd - now;
  if (left > 0) {
    ctx.fillStyle = 'rgba(245,245,245,.7)'; ctx.fillRect(0, 0, area, ch);
    const txt = left > 3000 ? 'TELEFONI PIATTI…' : String(Math.ceil(left / 1000));
    bigText(txt, area / 2, ch / 2, left > 3000 ? 54 : 180, C.blue);
  } else if (now < goFlash) bigText('KÖR!', area / 2, ch / 2, 160, C.blue);
  if (banner && now < banner.until) {
    ctx.font = '900 28px Verdana, sans-serif'; const w = ctx.measureText(banner.text).width + 50;
    ctx.fillStyle = C.yellow; ctx.fillRect(area / 2 - w / 2, 18, w, 54);
    ctx.fillStyle = banner.color; ctx.textAlign = 'center'; ctx.fillText(banner.text, area / 2, 46);
  }
  if (now < flashUntil && Math.floor(now / 140) % 2) {      // SWEDISH FLAG flash
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#006AA7'; ctx.fillRect(0, 0, area, ch);
    ctx.fillStyle = '#FECC00'; ctx.fillRect(area * 0.3, 0, area * 0.08, ch); ctx.fillRect(0, ch * 0.45, area, ch * 0.1);
    ctx.globalAlpha = 1;
  }
  if (now < darkUntil) { ctx.fillStyle = 'rgba(0,0,0,.82)'; ctx.fillRect(0, 0, area, ch); bigText('BLACKOUT', area / 2, ch / 2, 60, '#333'); }
}
function bigText(t, x, y, size, color) {
  ctx.font = `900 ${size}px Verdana, Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 10; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y);
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}

/* ---------- results + podium ---------- */
let podium = null;
function showResults(d) {
  const track = TR.byId[d.trackId];
  $('rtrack').textContent = track ? track.name : '';
  const box = $('rtable'); box.innerHTML = '';
  d.results.forEach(r => {
    const row = document.createElement('div'); row.className = 'rrow' + (r.rank === 1 ? ' first' : '');
    const laps = r.lapTimes.map((l, i) => `G${i + 1} ${R.fmtTime(l)}`).join('  ·  ');
    row.innerHTML = `<div class="rk">${r.rank}°</div><div class="nm"><i style="background:${r.color}"></i><span></span></div>
      <div class="tm">${r.time == null ? 'NON ARRIVATO' : R.fmtTime(r.time)}${r.pts != null ? `<div style="font-size:16px;color:#00A651">+${r.pts} punti</div>` : ''}</div><div class="laps">${laps || '—'}</div>`;
    row.querySelector('.nm span').textContent = r.name;
    box.append(row);
  });
  podium = { start: performance.now(), res: d.results, parts: new R.Particles(), confetti: false };
  show('results');
}
const pc = $('podium'), pctx = pc.getContext('2d');
const easeBounce = x => { const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; };
let plast = 0;
function drawPodium(now) {
  if (!podium) return;
  const dt = Math.min(0.05, (now - (plast || now)) / 1000); plast = now;
  const dpr = Math.min(2, window.devicePixelRatio || 1), cw = pc.clientWidth, ch = pc.clientHeight;
  if (pc.width !== Math.round(cw * dpr)) { pc.width = Math.round(cw * dpr); pc.height = Math.round(ch * dpr); }
  const x = pctx, C = R.C, t = (now - podium.start) / 1000;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = C.floor; x.fillRect(0, 0, cw, ch);
  x.fillStyle = C.track; x.fillRect(0, ch * 0.86, cw, ch * 0.14);
  x.fillStyle = C.yellow; for (let i = 0; i < cw; i += 40) x.fillRect(i, ch * 0.86, 24, 4);
  x.fillStyle = C.blue; x.font = `900 ${Math.round(ch * 0.07)}px Verdana, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('IL PODIO IN ESPOSIZIONE', cw / 2, ch * 0.09, cw - 30);
  const u = Math.min(cw / 3.4, ch / 3.2);         // shelf cube size
  const slots = [{ rank: 2, cx: cw / 2 - u * 1.1, h: 2 }, { rank: 1, cx: cw / 2, h: 3 }, { rank: 3, cx: cw / 2 + u * 1.1, h: 1 }];
  const base = ch * 0.86;
  slots.forEach(sl => {
    const r = podium.res.find(z => z.rank === sl.rank);
    const sw = u, sh = u * 0.62 * sl.h, sx = sl.cx - sw / 2, sy = base - sh;
    // KALLAX-style display shelf
    x.fillStyle = C.birch; x.fillRect(sx, sy, sw, sh);
    x.strokeStyle = '#A88B5E'; x.lineWidth = Math.max(3, u * 0.03);
    x.strokeRect(sx, sy, sw, sh);
    for (let k = 1; k < sl.h; k++) { x.beginPath(); x.moveTo(sx, sy + k * sh / sl.h); x.lineTo(sx + sw, sy + k * sh / sl.h); x.stroke(); }
    x.beginPath(); x.moveTo(sl.cx, sy); x.lineTo(sl.cx, base); x.stroke();
    // products in the cubes
    for (let k = 0; k < sl.h; k++) {
      const cy = sy + (k + 0.5) * sh / sl.h, cs = u * 0.13;
      R.drawBoxShape(x, sl.cx - sw / 4, cy + cs * 0.4, cs);
      x.save(); x.translate(sl.cx + sw / 4, cy); x.scale(u / 80, u / 80); R.drawIcon(x, ['lamp', 'plant', 'cup'][k % 3], 0, 0, 0.8); x.restore();
    }
    x.fillStyle = C.blue; x.font = `900 ${Math.round(u * 0.32)}px Verdana, sans-serif`; x.fillText(sl.rank, sl.cx - sw / 4, sy + sh / sl.h * 0.5 - u * 0.17);
    if (!r) return;
    // car "product" drops onto the shelf
    const delay = { 3: 0.3, 2: 0.9, 1: 1.6 }[sl.rank], k = Math.max(0, Math.min(1, (t - delay) / 0.9));
    if (t < delay) return;
    const top = sy - u * 0.27, y = -u + (top + u) * easeBounce(k);
    R.drawCar(x, sl.cx, y, -Math.PI / 2 + Math.sin(t * 2 + sl.rank) * 0.04 * (1 - k * 0.5), r.color, { scale: u / 48 });
    if (sl.rank === 1 && k >= 1 && !podium.confetti) {
      podium.confetti = true;
      for (let i = 0; i < 6; i++) podium.parts.emit(cw / 2, sy - u * 0.3, { n: 30, colors: [C.blue, C.yellow, '#fff', C.red], speed: 420, life: 2.2, size: 9, square: true, gravity: 380 });
    }
    // yellow price tag
    if (k >= 1) {
      const tw = u * 0.95, th = u * 0.36, tx = sl.cx - tw / 2, ty = base + ch * 0.015;
      x.fillStyle = C.yellow; x.fillRect(tx, ty, tw, th);
      x.strokeStyle = C.ink; x.lineWidth = 2; x.strokeRect(tx, ty, tw, th);
      x.fillStyle = C.ink; x.font = `900 ${Math.round(th * 0.36)}px Verdana, sans-serif`; x.fillText(r.name, sl.cx, ty + th * 0.33, tw - 10);
      x.fillStyle = C.blue; x.font = `900 ${Math.round(th * 0.3)}px Verdana, sans-serif`;
      x.fillText(r.time == null ? '—' : R.fmtTime(r.time), sl.cx, ty + th * 0.73);
    }
  });
  podium.parts.update(dt); podium.parts.draw(x);
}
renderTracks();
</script>
